[tox]
envlist = django{42,52}, quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
setenv =
    DJANGO_SETTINGS_MODULE = edxsearch.settings
    PYTHONPATH = {toxinidir}/src
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = make
commands =
    python -Wd -m coverage run manage.py test search {posargs}
    python -m coverage xml

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make quality
