name: Python CI

on:
  pull_request:
    branches:
    - '**'
  workflow_call:

jobs:
  run_tests:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        toxenv: [django42, django52, quality]

    env:
      MEILISEARCH_URL: http://localhost:7700

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        python-version: "${{ matrix.python-version }}"

    - name: Start Meilisearch
      run: make meili-up

    - name: Start Elasticsearch
      run: make elastic-up

    - name: Install CI dependencies
      run: uv sync --locked --group ci

    - name: Run Tests
      # Sleep is needed to give elasticsearch enough time to startup.
      # Longer term we should switch to the upstream ES github action to start up the server
      run: sleep 10 && uv run tox -e ${{ matrix.toxenv }}

    - name: Run Coverage
      if: matrix.toxenv == 'django52' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
